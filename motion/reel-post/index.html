<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Win Win — reel post</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script src="../node_modules/gsap/dist/CustomEase.min.js"></script>
  </head>
  <body>
    <div id="stage">
      <!-- The blur of a fast jump: up and down only. -->
      <svg width="0" height="0" aria-hidden="true">
        <filter id="jump-blur" x="-5%" y="-30%" width="110%" height="160%" color-interpolation-filters="sRGB">
          <feGaussianBlur id="jump-blur-amount" stdDeviation="0 0" />
        </filter>
      </svg>
      <div id="reel"></div>
      <div id="edges"></div>
      <div class="caption left"></div>
      <div class="caption right"></div>
      <i class="dot tl"></i><i class="dot tr"></i><i class="dot bl"></i><i class="dot br"></i>
    </div>
    <div id="controls" hidden>
      <button id="toggle" type="button">Pauze</button>
      <input id="scrub" type="range" min="0" max="1" step="0.0005" value="0" aria-label="Plek in de animatie" />
      <span id="time"></span>
    </div>
    <script type="module" src="./reel.js"></script>
  </body>
</html>
