<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Win Win — cube post</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script src="../node_modules/gsap/dist/CustomEase.min.js"></script>
  </head>
  <body>
    <div id="stage">
      <!-- The words: two sides of an unseen cube as wide as the post. -->
      <div id="words"><div id="word-cube"></div></div>
      <!-- The block: a cube of its own, in front of the words. -->
      <div id="block"><div id="block-cube"></div></div>
    </div>
    <div id="controls" hidden>
      <button id="toggle" type="button">Pauze</button>
      <input id="scrub" type="range" min="0" max="1" step="0.0005" value="0" aria-label="Plek in de animatie" />
      <span id="time"></span>
    </div>
    <script type="module" src="./cube.js"></script>
  </body>
</html>
